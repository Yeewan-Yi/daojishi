<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#eaf1f3"><title>拾光 · 有期</title><link rel="icon" href="./favicon.svg?v=20261022-journey" type="image/svg+xml"><link rel="stylesheet" href="./fonts.css"><link rel="stylesheet" href="./memories.css?v=20261022-journey"><link rel="stylesheet" href="./release-notes.css?v=20261022-notes"><script type="module" src="./memories.js?v=20261022-notes"></script></head><body>
<div class="paper-grain" aria-hidden="true"></div><div class="memory-shell">
<header class="memory-header"><a class="memory-brand" id="home-brand" href="./" aria-label="有期首页"><span class="brand-emblem" id="brand-emblem"></span><span>有期</span><i></i><span class="brand-sub">拾光</span></a><nav aria-label="页面工具"><span class="connection-label" id="connection-label">正在连接</span><button class="line-action" id="memory-theme" aria-label="切换深色模式"><svg viewBox="0 0 32 32"><path d="M22 6a11 11 0 1 0 4 18A12 12 0 0 1 22 6ZM6 5h5m-2-2v5"/></svg><span>明暗</span></button><a class="line-action" id="home-link" href="./" aria-label="返回航程"><svg viewBox="0 0 32 32"><path d="M26 16H6m9-9-9 9 9 9M26 6h3v20h-3"/></svg><span>归航</span></a></nav></header>
<main class="memory-layout"><aside class="city-index" aria-label="城市目录"><div class="index-heading"><span id="trail-emblem"></span><h2>履痕</h2><span id="city-total">—</span></div><p class="index-caption">沿着走过的路，拾起光。</p><div id="city-index-list" class="city-index-list"></div><a id="map-link" class="map-return" href="./"><span>去地图，点亮下一城</span><svg viewBox="0 0 28 28"><path d="M3 14h20m-7-7 7 7-7 7"/></svg></a><div class="index-rule" aria-hidden="true"></div><p class="private-caption" id="private-caption">留给我们两个人</p></aside>
<section class="city-journal"><div class="journal-overline"><span id="city-region">共同的旅行手记</span><span class="folio" id="folio">01 / —</span></div><div class="city-hero"><div><p class="hero-caption">在这里，时间有了形状。</p><h1 id="city-title">拾光</h1><p class="hero-description" id="city-description">把走过的路，留成我们的故事。</p></div><svg id="city-contour" viewBox="0 0 220 180" aria-hidden="true"></svg></div>
<div class="journal-toolbar"><div class="media-filters" role="group" aria-label="筛选回忆"><button class="is-active" data-filter="all" aria-pressed="true">全部</button><button data-filter="image" aria-pressed="false">照片</button><button data-filter="video" aria-pressed="false">影像</button></div><div class="journal-tools"><button class="quiet-action" id="refresh-memories" aria-label="刷新回忆"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button><button class="ink-action" id="add-memory"><span>＋</span>添一页</button></div></div>
<p class="page-status" id="page-status" role="status" aria-live="polite"></p><div class="memory-gallery" id="memory-gallery"></div><div class="journal-empty" id="journal-empty" hidden><svg viewBox="0 0 240 140" aria-hidden="true"><path d="M30 102c55-40 87 16 181-35M15 115c70-30 119 16 211-30M75 98l5-51 61-8 14 48M81 46l45-22 52 42-24 23M104 67l12-18 17 12"/><circle cx="149" cy="33" r="8"/><path d="m45 40 5-9 5 9-5 9Z"/></svg><h2>这一页，等我们一起写。</h2><p>一张照片，一段影像，或一句当时没说完的话。</p><button id="first-memory" class="text-action">留下第一份回忆 <span>↗</span></button></div><button class="more-action" id="more-memories" hidden>再翻一页</button></section></main>
<footer class="memory-footer"><span>有期 · 两个人的时光档案</span><span id="storage-label">影像独立存放，故事慢慢生长。</span></footer></div>
<dialog id="upload-dialog" class="paper-dialog upload-dialog"><form id="upload-form"><div class="dialog-heading"><div><span class="overline">留下一段时光</span><h2>添一页</h2></div><button type="button" class="close-action" data-close="upload-dialog" aria-label="关闭上传窗口">×</button></div><div class="upload-body"><div><label class="drop-area" id="drop-area" tabindex="0"><input id="memory-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/mp4,video/webm" multiple hidden><svg viewBox="0 0 48 48"><path d="M7 10h34v28H7ZM14 31l9-12 7 9 5-5 6 8M30 10V4m-5 5 5-5 5 5"/></svg><strong>把照片或影像，轻放在这里</strong><span>点击选择，也可以拖入</span></label><div class="upload-previews" id="upload-previews"></div><p class="file-hint">照片自动生成轻量副本；视频支持 MP4 / WebM，单段不超过 40 MB、10 分钟。原件请另行保存。</p></div><div class="upload-fields"><label>这一页的名字<input id="memory-title" maxlength="80" placeholder="例如：风经过绍兴的那天"></label><label>发生的日子<input id="memory-date" type="date"></label><label>想留住的话<textarea id="memory-body" maxlength="2000" rows="5" placeholder="那时的天气、街角的声音，还有身边的你……"></textarea></label><div class="upload-progress" id="upload-progress" hidden><span id="upload-progress-label">正在装入回忆</span><progress id="upload-progress-bar" max="100" value="0"></progress></div><p class="form-error" id="upload-error" role="alert"></p><button class="ink-action submit-memory" id="save-memory" disabled>收入拾光 <span>↗</span></button></div></div></form></dialog>
<dialog id="media-dialog" class="paper-dialog media-dialog"><button class="close-action viewer-close" data-close="media-dialog" aria-label="关闭回忆">×</button><div class="media-viewer"><div class="viewer-stage" id="viewer-stage"></div><section class="viewer-notes"><span class="overline" id="viewer-city"></span><h2 id="viewer-title"></h2><p class="viewer-date" id="viewer-date"></p><p class="viewer-body" id="viewer-body"></p><div class="comments-heading"><span>页边絮语</span><span id="comment-count"></span></div><div class="comments-list" id="comments-list" aria-live="polite"></div><button class="text-action" id="older-comments" hidden>更早的话</button><form class="comment-form" id="comment-form"><label for="comment-body" class="sr-only">写下照片或视频评论</label><textarea id="comment-body" maxlength="1000" rows="2" placeholder="看见这一刻，你想说什么？"></textarea><div><span id="comment-error" role="status"></span><button id="send-comment" type="submit" disabled>落笔 <span>↗</span></button></div></form></section></div></dialog>
<div class="memory-toast" id="memory-toast" role="status"></div></body></html>
