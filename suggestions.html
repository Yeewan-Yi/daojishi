<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#eaf1f3"><title>共议 · 有期</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./shared/subsite.css?v=20261025"><link rel="stylesheet" href="./suggestions.css?v=20261025"><script type="module" src="./suggestions-ui.js?v=20261025"></script></head><body><div class="site-wrap">
<header class="site-header"><a class="site-brand" data-site-brand aria-label="有期首页"></a><nav class="site-nav" aria-label="页面导航"><a data-site-link="index.html">有期</a><a data-site-link="memories.html">拾光</a><a id="back-site">返回原页</a><button class="site-tool" data-theme-toggle aria-label="切换主题"></button></nav></header>
<main><div class="council-heading"><div><h1>共议</h1><p class="quiet" id="scope-copy">把想法写下来，一起慢慢修订。</p></div><a id="overview-link" hidden>查看全部网站 ↗</a></div>
<p class="council-notice" id="connection-notice" role="status"></p>
<details class="proposal-composer" id="proposal-composer"><summary>提一笔 <span aria-hidden="true">＋</span></summary><form id="proposal-form"><fieldset id="proposal-targets"><legend>写给哪些网站</legend><div class="site-choices" id="target-choices"></div></fieldset><label for="proposal-body" class="sr-only">建议内容</label><textarea id="proposal-body" rows="4" maxlength="2000" placeholder="哪里值得调整？你希望它变成什么样？"></textarea><div class="compose-actions"><span id="proposal-status" role="status"></span><button type="submit" id="proposal-submit" disabled>记下这笔 ↗</button></div></form></details>
<div class="council-filters"><label>归属<select id="site-filter" aria-label="按网站查看建议"></select></label><label>进展<select id="state-filter" aria-label="按处理状态查看建议"></select></label><button id="refresh-council" aria-label="刷新共议">↻</button><span id="sync-hint" role="status"></span></div>
<div class="council-workspace"><section class="proposal-index" aria-label="建议列表"><div id="proposal-list"></div><p id="list-empty" class="quiet" hidden>还没有这一页的建议。想到了，就提一笔。</p><button id="more-proposals" class="text-action" hidden>更早的建议</button></section>
<section class="proposal-thread" id="proposal-thread" aria-label="建议讨论" hidden><div class="thread-heading"><span>这一笔</span><button id="close-thread" aria-label="收起讨论">×</button></div><div id="thread-sites" class="proposal-tags"></div><p id="thread-body" class="thread-body"></p><p id="thread-meta" class="quiet"></p><button id="older-events" class="text-action" hidden>更早的讨论</button><ol id="event-list" aria-label="回复与流转记录"></ol><p id="thread-status" role="status"></p>
<form id="reply-form"><label for="reply-body">接一句</label><textarea id="reply-body" rows="3" maxlength="1000" placeholder="补充想法，或说说这次的调整……"></textarea><div class="compose-actions"><span></span><button id="reply-submit" type="submit" disabled>回应 ↗</button></div></form>
<details class="progress-editor" id="progress-editor"><summary>标记进展 <span aria-hidden="true">⌄</span></summary><form id="progress-form"><label>处理状态<select id="progress-state"></select></label><fieldset id="transfer-targets" hidden><legend>转交到</legend><div id="transfer-choices" class="site-choices"></div></fieldset><label for="progress-note">补充说明（可选）</label><textarea id="progress-note" rows="2" maxlength="1000" placeholder="留下一句缘由，方便彼此接着做。"></textarea><div class="compose-actions"><span id="progress-status" role="status"></span><button type="submit" id="progress-submit">更新进展 ↗</button></div></form></details></section></div>
</main><footer class="site-footer">有期 · 一起写，一起改</footer></div></body></html>
