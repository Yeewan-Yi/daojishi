</style></head><body><div class="page" id="page"><div class="paper"></div><div class="spotlight"></div><header class="top"><span class="brand">有期</span><span>金纺轮 · 独立交互概念</span></header><main class="composition"><div class="copy"><span class="eyebrow">A THREAD BETWEEN NOW & THEN</span><h1>把时间，<br>织成<em>相遇。</em></h1><p class="event">下一次见面</p><div class="countdown" role="timer" aria-label="示例倒计时"><span><strong id="d">11</strong><small>天</small></span><i>:</i><span><strong id="h">09</strong><small>时</small></span><i>:</i><span><strong id="m">36</strong><small>分</small></span><i>:</i><span><strong id="s">00</strong><small>秒</small></span></div><div class="line"></div><div class="progress-controls"><label for="progress"><span>示例时间进度</span><span id="progress-label">62%</span></label><input type="range" id="progress" min="0" max="100" value="62" step="1"><div class="controls"><button id="pause">暂停轮转</button><button id="reset">复位</button></div></div></div><div class="wheel-interaction" id="wheel-control" tabindex="0" role="slider" aria-label="拖动旋转金轮，方向键调整角度，空格暂停" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0"><svg class="wheel-svg" id="scene" viewBox="0 0 900 900" aria-hidden="true"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e4d23"/><stop offset=".18" stop-color="#e4d097"/><stop offset=".36" stop-color="#a7813e"/><stop offset=".5" stop-color="#f5e2ad"/><stop offset=".71" stop-color="#8e692f"/><stop offset=".87" stop-color="#cfb573"/><stop offset="1" stop-color="#65471e"/></linearGradient><radialGradient id="hub"><stop stop-color="#f3e6b9"/><stop offset=".65" stop-color="#c4a65d"/><stop offset="1" stop-color="#8d682e"/></radialGradient></defs><ellipse cx="465" cy="775" rx="285" ry="25" fill="#8c723a" opacity=".045"/><g id="rotor"><circle class="rim" cx="450" cy="430" r="315" stroke-width="22"/><circle cx="450" cy="430" r="328" fill="none" stroke="#b09455" stroke-width="1.2"/><circle cx="450" cy="430" r="302" fill="none" stroke="#eadba9" stroke-width="2"/><circle cx="450" cy="430" r="283" fill="none" stroke="#a68744" stroke-width=".8" opacity=".5"/><g class="etching" id="ticks"></g><g class="spokes" id="spokes"></g><g id="ribbons"></g><circle class="rim" cx="450" cy="430" r="63" stroke-width="4"/><circle cx="450" cy="430" r="45" fill="url(#hub)" stroke="#eedca6" stroke-width="2"/><path d="M435 445Q425 432 437 423L435 397Q435 391 440 395L448 417 454 394Q458 387 462 395L459 421Q474 429 465 442L470 450H434Z" fill="#8c6b30" opacity=".8"/><circle cx="450" cy="430" r="20" fill="none" stroke="#f8edc4" stroke-width="1" opacity=".45"/></g><path class="threads" d="M452 448C630 329 747 425 686 533S599 657 747 704 807 767 742 759C666 750 664 696 715 694S797 727 758 754"/><g transform="translate(704 714)"><circle r="58" fill="url(#hub)" opacity=".85"/><g class="threads"><ellipse rx="57" ry="43"/><ellipse rx="49" ry="56" transform="rotate(32)"/><ellipse rx="56" ry="36" transform="rotate(69)"/><ellipse rx="53" ry="27" transform="rotate(-40)"/><ellipse rx="38" ry="57" transform="rotate(-20)"/><path d="M-40-15Q0 48 45-20M-48 7Q0-43 43 20"/></g></g><g transform="translate(779 752) scale(.72)"><circle r="58" fill="url(#hub)" opacity=".85"/><g class="threads"><ellipse rx="57" ry="43"/><ellipse rx="49" ry="56" transform="rotate(32)"/><ellipse rx="56" ry="36" transform="rotate(69)"/><ellipse rx="53" ry="27" transform="rotate(-40)"/></g></g><g transform="translate(660 774) scale(.6)"><circle r="58" fill="url(#hub)"/><g class="threads"><ellipse rx="57" ry="43"/><ellipse rx="49" ry="56" transform="rotate(32)"/><ellipse rx="56" ry="36" transform="rotate(69)"/></g></g></svg></div><span class="wheel-caption">拖动金轮，拨动此刻</span></main><footer class="bottom"><span>独立效果预览 · 示例数据 · 未接入正式倒计时</span><a href="https://wiki.biligame.com/reverse1999/%E9%87%91%E7%BA%BA%E8%BD%AE" target="_blank" rel="noreferrer">视觉参考：重返未来 1999 · 金纺轮 ↗</a></footer></div><script>
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
function shape(tag,attributes,parent){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attributes))n.setAttribute(k,v);parent.append(n);return n}
for(let i=0;i<24;i++){const a=i*Math.PI/12;shape('line',{x1:450+62*Math.cos(a),y1:430+62*Math.sin(a),x2:450+303*Math.cos(a+.035),y2:430+303*Math.sin(a+.035)},$('spokes'))}
for(let i=0;i<120;i++){const a=i*Math.PI/60,r=i%5?311:306;shape('line',{x1:450+r*Math.cos(a),y1:430+r*Math.sin(a),x2:450+319*Math.cos(a),y2:430+319*Math.sin(a)},$('ticks'))}
for(let i=0;i<9;i++){const a=(25+i*14)*Math.PI/180,b=a+.16;const p=(r,t)=>`${450+r*Math.cos(t)},${430+r*Math.sin(t)}`;shape('polygon',{points:`${p(270,a)} ${p(270,b)} ${p(189,a+.08)}`,fill:i%2?'#a6b6a0':'#637e84',opacity:'.67'},$('ribbons'))}
let angle=0,velocity=0,dragging=false,lastAngle=0,lastFrame=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(){ $('rotor').setAttribute('transform',`rotate(${angle} 450 430)`);$('wheel-control').setAttribute('aria-valuenow',String(Math.round((angle%360+360)%360))); }
function frame(now){const dt=Math.min(40,now-lastFrame||16)/16.667;lastFrame=now;if(!dragging){if(Math.abs(velocity)>.015){angle+=velocity*dt;velocity*=Math.pow(.96,dt)}else if(!paused)angle+=.055*dt;draw()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function pointerAngle(e){const r=$('wheel-control').getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height*.478),e.clientX-(r.left+r.width*.5))*180/Math.PI}
$('wheel-control').addEventListener('pointerdown',e=>{dragging=true;velocity=0;lastAngle=pointerAngle(e);$('wheel-control').setPointerCapture(e.pointerId)});
$('wheel-control').addEventListener('pointermove',e=>{if(!dragging)return;const next=pointerAngle(e);let delta=next-lastAngle;if(delta>180)delta-=360;if(delta< -180)delta+=360;angle+=delta;velocity=delta;lastAngle=next;draw()});
function release(){dragging=false} $('wheel-control').addEventListener('pointerup',release);$('wheel-control').addEventListener('pointercancel',release);
function pause(){paused=!paused;velocity=0;$('pause').textContent=paused?'继续轮转':'暂停轮转'}$('pause').textContent=paused?'继续轮转':'暂停轮转';$('pause').addEventListener('click',pause);
$('wheel-control').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(e.key===' ')pause();else{angle+=e.key==='ArrowLeft'?-15:15;draw()}}});
let deadline=Date.now()+30*86400000*.38;
function updateProgress(){const progress=Number($('progress').value);$('progress-label').textContent=progress+'%';deadline=Date.now()+30*86400000*(1-progress/100);angle=progress*3.6;draw();clock()}
function clock(){let seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));for(const[id,value]of [['d',Math.floor(seconds/86400)],['h',Math.floor(seconds/3600)%24],['m',Math.floor(seconds/60)%60],['s',seconds%60]])$(id).textContent=String(value).padStart(2,'0')}
$('progress').addEventListener('input',updateProgress);$('reset').addEventListener('click',()=>{$('progress').value=62;velocity=0;updateProgress()});setInterval(clock,1000);updateProgress();
document.addEventListener('pointermove',e=>{const r=$('page').getBoundingClientRect();$('page').style.setProperty('--px',e.clientX+'px');$('page').style.setProperty('--py',(e.clientY-r.top)+'px')});
</script></body></html>
