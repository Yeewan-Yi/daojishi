<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光 · 本地整理</title><style>:root{color-scheme:dark;font:16px Georgia,'Microsoft Yahei',serif;color:#dfded7;background:#0b121e}*{box-sizing:border-box}body{max-width:1400px;margin:auto;padding:38px 5vw}header{display:flex;justify-content:space-between;align-items:center;gap:25px;border-bottom:1px solid #a3b3c533;padding-bottom:25px}h1{font-size:30px;font-weight:400;letter-spacing:4px;margin:8px 0}small,p{color:#9daabc;line-height:1.8}button{font:inherit;border:1px solid #a3b3c544;background:#233045;color:inherit;padding:10px 18px;cursor:pointer}button:disabled{opacity:.4;cursor:default}#gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px 12px;margin:30px 0}article{min-width:0}article img{width:100%;aspect-ratio:1.15;object-fit:cover;display:block}article label{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px}article input[type=text]{width:100%;min-width:0;padding:9px 2px;background:none;border:0;border-bottom:1px solid #a3b3c544;color:inherit;font:13px inherit}article small{font-size:11px;display:block;margin-top:8px}article:has(input:checked) img{outline:2px solid #c5b581;outline-offset:-2px}.actions{display:flex;gap:10px;flex-wrap:wrap}#status{min-height:25px}.note{font-size:12px;max-width:880px}@media(max-width:800px){#gallery{grid-template-columns:repeat(3,minmax(0,1fr))}header{display:block}.actions{margin-top:18px}}@media(max-width:480px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:25px}}</style><header><div><small>有期 · 照片助手</small><h1>拾光，本地整理。</h1></div><div class="actions"><button id="run">重新离线分析</button><button id="save">保存整理方案</button></div></header><p class="note">CLIP 在这台电脑上分析画面主题、相似度，结合清晰度推荐最多五张封面。名称是待核对的建议，不会自动改动原文件或覆盖网站标题。保存的方案留在本机，原图始终保留。</p><p id="status" role="status">正在读取整理结果…</p><main id="gallery"></main><script src="/app.js" defer></script></html>
