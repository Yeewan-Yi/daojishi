name: Check contributions
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-subsites.mjs
      - run: node scripts/verify-suggestions-db.mjs
      - run: node --check suggestions-ui.js
      - run: npm test
