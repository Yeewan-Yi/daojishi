name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify syntax and countdown behavior
        run: |
          node --check app.js
          node --check countdown.js
          node --check cloud.js
          node --check flight.js
          node --check flip-clock.js
          node --check globe-3d.js
          node --check globe-math.js
          node --test
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html styles.css flight.css refined.css scene.css flight.js flip-clock.js app.js countdown.js cloud.js config.js favicon.svg _site/
          cp globe-3d.js globe-math.js land.geojson _site/
          mkdir _site/vendor
          cp vendor/three.module.js vendor/THREE-LICENSE _site/vendor/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
