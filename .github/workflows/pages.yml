name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install database verifier
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify syntax and countdown behavior
        run: |
          node scripts/check-subsites.mjs
          node --check suggestions-ui.js
          node --check suggestions-alerts.js
          node --check suggestions-link.js
          node --check suggestions-legacy.js
          node scripts/verify-suggestions-db.mjs
          node --check app.js
          node --check countdown.js
          node --check cloud.js
          node --check flight.js
          node --check flip-clock.js
          node --check memory-map.js
          node --check journey-data.js
          node --check memories.js
          node --check release-notes.js
          node --check globe-3d.js
          node --check globe-math.js
          node --check globe-labels.js
          node --check letters.js
          node --check letters-ui.js
          node --check date-picker.js
          node --check letter-media.js
          node --check boot.js
          node --check motion.js
          node --test
          node scripts/verify-journey-db.mjs
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html styles.css flight.css refined.css scene.css fonts.css flight.js flip-clock.js app.js countdown.js cloud.js config.js favicon.svg _site/
          cp globe-3d.js globe-math.js globe-labels.js memory-map.js memory-map.css countries.geojson visited-cities.geojson land.geojson _site/
          cp detail-land.geojson _site/
          cp letters.js letters-ui.js letters.css boot.js motion.js date-picker.js letter-media.js experience.css _site/
          cp country-index.json journey-navigation.js memories.html memories.css memories-fluid.css memories.js album-loader.js journey-data.js symbols.js _site/
          cp release-notes.js release-notes.css _site/
          cp collaborate.html _site/
          cp suggestions.html suggestions.css suggestions.js suggestions-ui.js suggestions-local.js suggestions-link.js suggestion-input.js suggestions-view.js suggestions-legacy.js suggestions-alerts.js suggestion-updates.js _site/
          cp -r shared pages _site/
          cp -r map-data _site/
          mkdir _site/vendor
          cp vendor/three.module.js vendor/THREE-LICENSE vendor/FONT-LICENSES.txt vendor/FZSongKeBenXiuKaiS.woff2 _site/vendor/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
